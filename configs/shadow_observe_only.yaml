mode: shadow
poll_interval_sec: 5
min_expected_edge_bps: 25
max_markets_per_cycle: 25

risk:
  max_position_per_market: 2000
  max_event_exposure: 8000
  max_category_exposure: 12000
  max_daily_loss: 1500
  max_drawdown: 3000
  min_liquidity: 5000
  max_spread_for_aggressive_bps: 150
  resolution_risk_max: 0.35
  toxicity_max: 0.65

execution:
  mode: passive
  tick_size: 0.01
  quote_levels: 3
  quote_size: 100
  post_only: true
  stale_quote_sec: 20
  slippage_bps_limit: 40
  gtd_minutes_before_catalyst: 15
  max_orders_per_run: 100
  max_order_notional_per_run: 50000

penalties:
  uncertainty_haircut: 0.5
  reward_haircut: 0.5
  toxicity_scale: 1.0
  resolution_scale: 1.0

adapters:
  rate_limit_per_sec: 5
  timeout_sec: 5
  retries: 3

costs:
  fee_bps: 0.0
  reward_bps_placeholder: 0.0

mode_controls:
  allow_live_orders: false
  live_confirmation:
  require_kill_switch_armed: true
  shadow_observe_only: true

kill_switch:
  global_enabled: false
  per_market_disabled: []

replay:
  skip_malformed_lines: false

wallet_validation:
  train_frac: 0.6
  val_frac: 0.2
  min_samples: 10
  latency_scenarios_sec: [0, 30, 120, 600]
  baselines: [random_wallet, top_pnl_wallet, top_roi_wallet, market_prior_only, category_only, momentum, no_wallet_signal]
  leakage_strict: true
  report_json_path: state/wallet_validation_report.json
  report_md_path: state/wallet_validation_report.md

signals:
  wallet_intelligence:
    enabled: true
    signal_name: wallet_intelligence
    signal_version: v1
    experiment_id: exp_wallet_shadow_001
    requested_mode: observe_only
    registry_path: state/registry_events.jsonl
    validation_report_path: state/wallet_validation_report.json
    dataset_paths:
      - state/recorded/market_snapshots.jsonl
      - state/recorded/wallet_observations.jsonl
      - state/recorded/resolved_outcomes.jsonl
    allow_edge_contribution: false

recorder:
  output_dir: state
  flush_every: 1
  fsync: true
  fail_on_error: true
