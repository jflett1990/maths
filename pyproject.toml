[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-structural-edge"
version = "0.1.0"
description = "Resolution-aware, incentive-adjusted, flow-sensitive hybrid maker/taker paper trading system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "tenacity>=8.2",
  "structlog>=24.1",
  "orjson>=3.10",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "mypy>=1.10", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
